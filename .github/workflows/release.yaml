name: Continuous Integration & Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-multiplatform:
    name: Build ${{ matrix.os }} installers
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: linux
          - os: windows-latest
            targets: windows
          - os: macos-latest
            targets: mac

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libarchive-tools \
            icnsutils \
            graphicsmagick

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Renderer
        run: npm run build

      - name: Build Linux Installers
        if: matrix.targets == 'linux'
        run: |
          npx electron-builder --linux deb AppImage --x64 --arm64 --publish never

      - name: Build Windows Installers
        if: matrix.targets == 'windows'
        run: npx electron-builder --win nsis --x64 --arm64 --publish never

      - name: Build macOS Installers
        if: matrix.targets == 'mac'
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never

      - name: Upload Linux Installers
        if: matrix.targets == 'linux'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-beta') }}
          files: |
            release/*.deb
            release/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installers
        if: matrix.targets == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-beta') }}
          files: |
            release/*.exe
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Installers
        if: matrix.targets == 'mac'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-beta') }}
          files: |
            release/*.dmg
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-snap:
    name: Build and Publish Snap
    needs: build-multiplatform
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libarchive-tools \
            icnsutils \
            graphicsmagick \
            squashfs-tools

      - name: Install Dependencies
        run: npm ci

      - name: Build and Verify Snap Packages
        id: build_snap
        shell: bash
        run: |
          set -euo pipefail

          echo "Building frontend..."
          npm run build

          echo "Building Snap packages with Electron Builder..."
          npx electron-builder --linux snap --x64 --arm64 --publish never

          shopt -s nullglob
          X64_FILES=(release/*_amd64.snap)
          ARM64_FILES=(release/*_arm64.snap)

          if [ "${#X64_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one x64 Snap package"
            exit 1
          fi

          if [ "${#ARM64_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ARM64 Snap package"
            exit 1
          fi

          mkdir -p snap-artifacts
          cp "${X64_FILES[0]}" "${ARM64_FILES[0]}" snap-artifacts/

          echo "x64_snap=${X64_FILES[0]}" >> "$GITHUB_OUTPUT"
          echo "arm64_snap=${ARM64_FILES[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Snap Installers to Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-beta') }}
          files: snap-artifacts/*.snap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}