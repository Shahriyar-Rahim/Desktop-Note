appId: com.example.desktopnotes
productName: Desktop Notes
copyright: Copyright © 2026 Rahim
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - build/icon.png
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
# better-sqlite3 v13 ships N-API prebuilt binaries that work with Electron,
# so no native rebuild step is needed.
npmRebuild: false
linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: build/icon.png
  maintainer: Rahim <rahim@example.com>
  synopsis: Local-first note taking
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.productivity
  icon: build/icon.png
