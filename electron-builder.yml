appId: com.no-idea.desktopnotes
productName: Desktop Notes
copyright: Copyright © 2026 Rahim

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - electron/**
  - build/icon.png
  - package.json

asar: true

asarUnpack:
  - node_modules/better-sqlite3/**

npmRebuild: true

# Linux Configuration
linux:
  category: Office
  icon: build/icon.png
  maintainer: Shahriyar Rahim
  synopsis: Local-first note taking
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: snap
      arch:
        - x64

# Snap Configuration
snap:
  base: core22
  useTemplateApp: true
  confinement: strict
  grade: stable
  summary: Local-first note taking

# Windows Configuration
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: build/icon.png