appId: com.example.desktopnotes
productName: Desktop Notes
copyright: Copyright © 2026 Rahim
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - build/icon.png
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
npmRebuild: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Office
  icon: build/icon.png
  maintainer: Rahim <rahim@example.com>
  synopsis: Local-first note taking

snap:
  useTemplateApp: false
  confinement: strict
  plugs:
    - default

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: build/icon.png